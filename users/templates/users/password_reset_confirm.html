{% extends 'mailings/base.html' %}
{% block content %}
<h2>Установка нового пароля</h2>
<p>Введите новый пароль для вашей учетной записи.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить новый пароль</button>
    <a href="{% url 'users:login' %}">Перейти ко входу</a>
</form>
{% endblock %}
