{% extends 'mailings/base.html' %}

{% block content %}
    <h1>Удалить письмо</h1>
    <p>Вы уверены, что хотите удалить письмо "{{ message.subject }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
    </form>
    <a href="{% url 'mailings:message_list' %}">Отмена</a>
{% endblock %}
